<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Pendalaman TKA Matematika</title>
<style>
:root{--bg:#f3f1ff;--c:#fff;--t:#1d1b3a;--m:#6b6890;--p:#6c4ff0;--p2:#13b5a6;--ok:#16a34a;--rg:#f59e0b;--no:#d9dcea;--bad:#dc2626;--bd:#e3e0f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14122b;--c:#1e1b3f;--t:#ecebff;--m:#a6a3cf;--no:#3a3763;--bd:#34305c}}
:root[data-theme=dark]{--bg:#14122b;--c:#1e1b3f;--t:#ecebff;--m:#a6a3cf;--no:#3a3763;--bd:#34305c}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
header{background:linear-gradient(120deg,#6c4ff0,#13b5a6);color:#fff;padding:22px 16px;text-align:center}
header h1{margin:0;font-size:26px}header p{margin:4px 0 0;opacity:.9}
main{max-width:920px;margin:0 auto;padding:16px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 14px #6c4ff014}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.row{grid-template-columns:1fr}}
label{display:block;font-weight:600;font-size:14px;margin-bottom:10px}
input{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--t);font:inherit;margin-top:4px}
.tos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.to{border:2px solid var(--bd);border-radius:14px;padding:14px;cursor:pointer;background:var(--c)}
.to.sel{border-color:var(--p);background:linear-gradient(135deg,#6c4ff01f,#13b5a61f)}.to b{font-size:18px}.to small{display:block;color:var(--m)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.pri{background:linear-gradient(120deg,#6c4ff0,#13b5a6);color:#fff}.sec{background:var(--bg);color:var(--t);border:1px solid var(--bd)}.rgb{background:var(--rg);color:#fff}.rgb.on{outline:3px solid #f59e0b55}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#tm{font-weight:700;font-size:20px;background:#6c4ff0;color:#fff;border-radius:10px;padding:4px 12px}#tm.low{background:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.n{padding:8px 0;background:var(--no);color:var(--t);border-radius:8px;text-align:center}.n.a{background:var(--ok);color:#fff}.n.r{background:var(--rg);color:#fff}.n.c{outline:3px solid var(--p)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;margin:8px 0;cursor:pointer}.opt.s{border-color:var(--p);background:#6c4ff018}
.lg{display:flex;gap:12px;font-size:13px;color:var(--m);margin-top:8px;flex-wrap:wrap}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:middle}
table{width:100%;border-collapse:collapse}td,th{border:1px solid var(--bd);padding:7px;text-align:left;font-size:14px}th{background:var(--bg)}td.c{text-align:center;width:90px}
.big{font-size:56px;font-weight:800;background:linear-gradient(120deg,#6c4ff0,#13b5a6);-webkit-background-clip:text;background-clip:text;color:transparent}
.ok{color:var(--ok);font-weight:700}.no{color:var(--bad);font-weight:700}.ex{background:var(--bg);border-left:4px solid var(--p2);padding:8px 12px;border-radius:8px;font-size:14px;margin-top:8px}
.cert{border:6px double var(--p);text-align:center;padding:24px}.cert h2{margin:0;color:var(--p);font-size:28px;letter-spacing:1px}
.bar{height:14px;border-radius:7px;background:linear-gradient(90deg,#6c4ff0,#13b5a6)}
.mod{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px}.mod .card{max-width:380px;margin:0}
footer{text-align:center;color:var(--m);font-size:14px;padding:18px 12px 28px}
@media print{header,footer,.np{display:none!important}body{background:#fff}main{padding:0}}
</style></head><body>
<header><h1>Pendalaman TKA Matematika</h1><p>Latihan Try Out untuk SMA/MA dan SMK/MAK</p></header>
<main>
<section id="s0"><div class="card"><h3 style="margin-top:0">Pilih Try Out</h3><div class="tos" id="tos"></div>
<div class="row"><label>Nama Siswa<input id="f1" placeholder="Nama lengkap"></label><label>Kelas<input id="f2" placeholder="mis. XII IPA 1"></label><label>Peserta Didik (NISN / No. Peserta)<input id="f3"></label><label>Asal Sekolah<input id="f4" placeholder="Nama sekolah"></label></div>
<p id="er" class="no"></p><button class="pri" onclick="start()">Mulai Try Out</button></div></section>
<section id="s1" hidden>
<div class="card top"><div><b id="who"></b><br><small id="inf" style="color:var(--m)"></small></div><div><span id="tm"></span> <button class="sec" onclick="ask()">Akhiri</button></div></div>
<div class="card"><div id="qa"></div><div class="top" style="margin-top:14px"><button class="sec" onclick="mv(-1)">« Sebelumnya</button><button class="rgb" id="rb" onclick="rag()">Ragu-ragu</button><button class="pri" onclick="mv(1)">Selanjutnya »</button></div></div>
<div class="card"><b>Navigasi Soal</b><div class="grid" id="nv" style="margin-top:8px"></div><div class="lg"><span><i style="background:var(--ok)"></i>Dijawab</span><span><i style="background:var(--rg)"></i>Ragu-ragu</span><span><i style="background:var(--no)"></i>Belum dijawab</span></div></div></section>
<section id="s2" hidden><div class="card" style="text-align:center"><div>Nilai Akhir</div><div class="big" id="sc"></div><div id="id2"></div><p id="st"></p><div class="np"><button class="pri" onclick="cert()">Lihat Sertifikat &amp; Progres</button> <button class="sec" onclick="show('s0')">Kembali ke Awal</button></div></div><h3>Pembahasan Soal</h3><div id="pb"></div></section>
<section id="s3" hidden><div class="np" style="margin-bottom:10px"><button class="pri" id="dlb" hidden onclick="dl()">⬇ Unduh Sertifikat (PNG)</button> <button class="sec" onclick="window.print()">Cetak</button> <span id="dm" style="font-size:14px"></span> <button class="sec" onclick="show('s2')">Kembali</button></div><div class="card cert" id="ct"></div></section>
</main>
<footer>Dikembangkan oleh <b>Dwi Fadila Rahmatika, S.Pd</b> · SMAN 1 Rajabasa</footer>
<div id="md" class="mod" hidden><div class="card"><p id="mt"></p><button class="pri" onclick="fin()">Ya, kumpulkan</button> <button class="sec" onclick="$('#md').hidden=true">Kembali</button></div></div>

const TO={1:{n:'Try Out 1',min:90,Q:T1},2:{n:'Try Out 2',min:20,Q:T2}};

$('#qa').innerHTML=h;$('#rb').className='rgb'+(rg[cur]?' on':'');$('#rb').textContent=rg[cur]?'✓ Ragu-ragu':'Ragu-ragu';nav()}
function nav(){$('#nv').innerHTML=Q.map((_,i)=>`<button class="n ${rg[i]?'r':done(i)?'a':''} ${i==cur?'c':''}" onclick="cur=${i};render()">${i+1}</button>`).join('')}

function tf(j,v){ans[cur]=ans[cur]||[];ans[cur][j]=v;render()}
const mv=d=>{cur=Math.max(0,Math.min(Q.length-1,cur+d));render()};

function fr(i){const q=Q[i],a=ans[i],k=q[3];if(q[0]=='pg')return a===k?1:0;

function keyT(q){const k=q[3];if(q[0]=='pg')return `${L[k]}. ${q[2][k]}`;if(q[0]=='mc')return k.map(j=>q[2][j]).join('; ');const l=lab(q);return q[2].map((_,j)=>`${j+1}: ${l[k[j]?0:1]}`).join(', ')}
function yourT(i){const q=Q[i],a=ans[i];if(!done(i))return '— (tidak dijawab)';if(q[0]=='pg')return `${L[a]}. ${q[2][a]}`;if(q[0]=='mc')return q[2].filter((_,j)=>a[j]).join('; ');const l=lab(q);return q[2].map((_,j)=>a[j]===undefined?`${j+1}: –`:`${j+1}: ${l[a[j]?0:1]}`).join(', ')}

<p style="margin-top:16px"><small>Dikembangkan oleh Dwi Fadila Rahmatika, S.Pd · SMAN 1 Rajabasa</small></p>`;show('s3')}
